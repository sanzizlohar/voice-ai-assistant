services:
  via:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: via
    ports:
      - "8080:8080"
    volumes:
      - via-data:/data          # learned rules + transcripts survive restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
    # uncomment to run real Whisper/Coqui models inside the container:
    # environment:
    #   VIA_WHISPER_MODEL: base
    # command: ["python", "-m", "voice_ai.main", "serve", "--port", "8080",
    #           "--engine", "whisper", "--db", "/data/via.db"]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: via-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  via-data:
