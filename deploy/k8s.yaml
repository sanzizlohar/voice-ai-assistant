# Voice AI Assistant — Kubernetes deployment (3 replicas + HPA).
# Stateless workers; learned rules live in the shared sqlite volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: via
  labels: { app: via }
spec:
  replicas: 3
  selector:
    matchLabels: { app: via }
  template:
    metadata:
      labels: { app: via }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: via
          image: via:1.0.0
          ports: [{ containerPort: 8080 }]
          args: ["python", "-m", "voice_ai.main", "serve",
                 "--port", "8080", "--db", "/data/via.db"]
          resources:
            requests: { cpu: "250m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: via-data }
---
apiVersion: v1
kind: Service
metadata:
  name: via
spec:
  selector: { app: via }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: via
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: via
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
